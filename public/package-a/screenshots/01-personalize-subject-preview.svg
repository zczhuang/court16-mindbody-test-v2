<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Geist, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="800" height="320" fill="#f7f5ef"/>
  <!-- panel header strip (the Settings tab area) -->
  <rect x="40" y="20" width="720" height="260" rx="8" fill="#fff" stroke="#e6e0cf" filter="url(#shadow)"/>
  <text x="56" y="44" font-size="12" font-weight="600" fill="#666" letter-spacing="0.8">EDIT INBOX CONTENT</text>
  <line x1="56" y1="54" x2="744" y2="54" stroke="#eee9d8"/>

  <!-- Subject line row -->
  <text x="56" y="80" font-size="12" font-weight="600" fill="#222">Subject line</text>
  <rect x="56" y="88" width="540" height="34" rx="4" fill="#fafafa" stroke="#d8d3c4"/>
  <text x="64" y="110" font-size="13" fill="#444">Set up your Court 16 account</text>
  <!-- Personalize button -->
  <rect x="604" y="88" width="118" height="34" rx="4" fill="#fff" stroke="#1a73e8" stroke-width="2"/>
  <text x="616" y="110" font-size="12" font-weight="600" fill="#1a73e8">✨ Personalize</text>
  <!-- annotation -->
  <path d="M 663 130 Q 670 160 600 170" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="600,170 608,166 605,174" fill="#c0392b"/>
  <text x="430" y="186" font-size="12" font-weight="600" fill="#c0392b">Click here, NOT the input field —</text>
  <text x="430" y="202" font-size="12" font-weight="600" fill="#c0392b">picks the merge token from a menu.</text>

  <!-- Preview text row -->
  <text x="56" y="232" font-size="12" font-weight="600" fill="#222">Preview text</text>
  <rect x="56" y="240" width="540" height="34" rx="4" fill="#fafafa" stroke="#d8d3c4"/>
  <text x="64" y="262" font-size="13" fill="#444">Allow us to assist you in the process!</text>
  <rect x="604" y="240" width="118" height="34" rx="4" fill="#fff" stroke="#1a73e8" stroke-width="2"/>
  <text x="616" y="262" font-size="12" font-weight="600" fill="#1a73e8">✨ Personalize</text>
</svg>
