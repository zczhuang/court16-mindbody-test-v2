<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Geist, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="900" height="540" fill="#f7f5ef"/>

  <!-- Left sidebar with icons (slim) -->
  <rect x="20" y="20" width="40" height="500" rx="4" fill="#fff" stroke="#e6e0cf"/>
  <rect x="26" y="28" width="28" height="28" rx="3" fill="#222"/>
  <text x="40" y="48" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">+</text>
  <circle cx="40" cy="80" r="3" fill="#aaa"/>
  <circle cx="40" cy="110" r="3" fill="#aaa"/>
  <circle cx="40" cy="140" r="3" fill="#aaa"/>
  <circle cx="40" cy="170" r="3" fill="#aaa"/>

  <!-- Add panel header -->
  <rect x="70" y="20" width="320" height="500" rx="6" fill="#fff" stroke="#e6e0cf" filter="url(#sh)"/>
  <text x="86" y="46" font-size="15" font-weight="700" fill="#222">Add</text>
  <line x1="86" y1="58" x2="376" y2="58" stroke="#eee9d8"/>
  <text x="86" y="80" font-size="12" font-weight="600" fill="#1a73e8">Modules</text>
  <line x1="86" y1="88" x2="160" y2="88" stroke="#1a73e8" stroke-width="2"/>
  <text x="200" y="80" font-size="12" font-weight="500" fill="#666">Sections</text>

  <!-- Search bar -->
  <rect x="86" y="100" width="290" height="30" rx="3" fill="#f5f3ec" stroke="#d8d3c4"/>
  <text x="96" y="120" font-size="12" fill="#aaa">Search</text>

  <!-- Recently used modules -->
  <text x="86" y="156" font-size="11" font-weight="700" fill="#444" letter-spacing="0.5">▼ RECENTLY USED MODULES</text>

  <!-- HTML module (highlighted) -->
  <rect x="86" y="170" width="64" height="64" rx="4" fill="#fff7c2" stroke="#f0b400" stroke-width="3"/>
  <text x="118" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#222">&lt;/&gt;</text>
  <text x="118" y="220" font-size="10" font-weight="600" text-anchor="middle" fill="#222">HTML</text>
  <!-- Button module -->
  <rect x="160" y="170" width="64" height="64" rx="4" fill="#fafafa" stroke="#d8d3c4"/>
  <rect x="172" y="190" width="40" height="14" rx="2" fill="#999"/>
  <text x="192" y="220" font-size="10" text-anchor="middle" fill="#666">Button</text>
  <!-- Text module -->
  <rect x="234" y="170" width="64" height="64" rx="4" fill="#fafafa" stroke="#d8d3c4"/>
  <text x="252" y="200" font-size="16" font-weight="700" fill="#888">A≡</text>
  <text x="266" y="220" font-size="10" text-anchor="middle" fill="#666">Text</text>
  <!-- Image module -->
  <rect x="308" y="170" width="64" height="64" rx="4" fill="#fafafa" stroke="#d8d3c4"/>
  <rect x="320" y="186" width="40" height="26" fill="none" stroke="#888"/>
  <circle cx="328" cy="194" r="3" fill="#888"/>
  <text x="340" y="220" font-size="10" text-anchor="middle" fill="#666">Image</text>

  <!-- Drag arrow from HTML module to body -->
  <path d="M 145 200 Q 280 280 510 320" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="510,320 498,316 502,328" fill="#c0392b"/>
  <text x="430" y="260" font-size="13" font-weight="700" fill="#c0392b">DRAG into body</text>

  <!-- Email body preview area -->
  <rect x="410" y="20" width="470" height="500" rx="6" fill="#e8effa" stroke="#cbd5e7" filter="url(#sh)"/>
  <rect x="450" y="60" width="390" height="60" rx="4" fill="#fff"/>
  <text x="464" y="84" font-size="12" font-weight="600" fill="#666">Subject:</text>
  <text x="514" y="84" font-size="12" fill="#222">Set up your Court 16 account</text>
  <text x="464" y="104" font-size="12" font-weight="600" fill="#666">Preview:</text>
  <text x="514" y="104" font-size="12" fill="#222">Allow us to assist you in the process!</text>

  <!-- Existing image block placeholder -->
  <rect x="450" y="140" width="390" height="160" rx="4" fill="#fff" stroke="#d8d3c4"/>
  <text x="645" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#bbb">[existing hero image]</text>

  <!-- HTML drop zone (new) - dashed -->
  <rect x="450" y="320" width="390" height="160" rx="6" fill="#fffbe6" stroke="#f0b400" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="645" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Drop HTML module here</text>
  <text x="645" y="384" font-size="11" text-anchor="middle" fill="#666">Then double-click → paste body HTML inside</text>
  <text x="645" y="402" font-size="11" text-anchor="middle" fill="#666">→ tokens like {{ contact.firstname }} render</text>
  <text x="645" y="418" font-size="11" text-anchor="middle" fill="#666">live in the preview after save.</text>
</svg>
