<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Court 16 — Class Concierge</title>
<style>
  :root {
    --c16-yellow: #f5e62b;
    --c16-ink: #0e0e0e;
    --c16-ink-2: #2a2a2a;
    --c16-muted: #6b6b6b;
    --c16-line: #ececec;
    --c16-bg: #fafafa;
    --c16-bubble-bot: #f1f1ef;
    --c16-bubble-user: #0e0e0e;
    --c16-bubble-user-text: #ffffff;
    --c16-accent: #0e0e0e;
    --shadow: 0 12px 40px rgba(0,0,0,.18);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; color: var(--c16-ink); background: #fff; }

  /* Demo page chrome so the widget can be seen in isolation */
  .demo-stage {
    min-height: 100vh; padding: 40px 24px 120px;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(245,230,43,.25), transparent 60%),
      radial-gradient(800px 500px at 0% 100%, rgba(14,14,14,.05), transparent 60%),
      #fafafa;
  }
  .demo-stage h1 { font-size: 22px; margin: 0 0 6px; }
  .demo-stage p { color: var(--c16-muted); margin: 0; max-width: 560px; }

  /* Floating launcher button */
  .c16-launcher {
    position: fixed; right: 24px; bottom: 24px; z-index: 99;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 999px; border: 0;
    background: var(--c16-yellow); color: var(--c16-ink);
    font-weight: 700; font-size: 15px; letter-spacing: .2px;
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform .12s ease;
  }
  .c16-launcher:hover { transform: translateY(-1px); }
  .c16-launcher .dot { width: 8px; height: 8px; border-radius: 50%; background: #25a34c; box-shadow: 0 0 0 4px rgba(37,163,76,.18); }

  /* Widget panel */
  .c16-widget {
    position: fixed; right: 24px; bottom: 24px; z-index: 100;
    width: min(400px, calc(100vw - 32px));
    height: min(640px, calc(100vh - 48px));
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: none; flex-direction: column; overflow: hidden;
    border: 1px solid var(--c16-line);
  }
  .c16-widget.open { display: flex; animation: pop .22s ease-out; }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Header */
  .c16-head {
    background: var(--c16-ink); color: #fff;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .c16-badge {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--c16-yellow); color: var(--c16-ink);
    display: grid; place-items: center; font-weight: 900; font-size: 14px;
    letter-spacing: .5px;
  }
  .c16-head-text { line-height: 1.15; }
  .c16-head-text .t1 { font-weight: 700; font-size: 14px; }
  .c16-head-text .t2 { font-size: 12px; opacity: .75; margin-top: 2px; }
  .c16-close {
    margin-left: auto; background: transparent; border: 0; color: #fff;
    font-size: 20px; cursor: pointer; opacity: .8; padding: 4px 6px;
  }
  .c16-close:hover { opacity: 1; }

  /* Messages */
  .c16-body {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    background: #fff; scroll-behavior: smooth;
  }
  .c16-row { display: flex; margin: 6px 0; }
  .c16-row.bot { justify-content: flex-start; }
  .c16-row.user { justify-content: flex-end; }
  .c16-bubble {
    max-width: 86%; padding: 10px 13px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.4;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .c16-row.bot .c16-bubble {
    background: var(--c16-bubble-bot); color: var(--c16-ink);
    border-bottom-left-radius: 4px;
  }
  .c16-row.user .c16-bubble {
    background: var(--c16-bubble-user); color: var(--c16-bubble-user-text);
    border-bottom-right-radius: 4px;
  }

  /* Typing indicator */
  .c16-typing {
    display: inline-flex; gap: 4px; padding: 12px 14px;
    background: var(--c16-bubble-bot); border-radius: 16px; border-bottom-left-radius: 4px;
  }
  .c16-typing span {
    width: 6px; height: 6px; border-radius: 50%; background: #b6b6b6;
    animation: blink 1.2s infinite ease-in-out;
  }
  .c16-typing span:nth-child(2) { animation-delay: .2s; }
  .c16-typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Quick replies */
  .c16-quick {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 6px 14px 4px;
  }
  .c16-quick button {
    border: 1px solid var(--c16-ink); background: #fff; color: var(--c16-ink);
    padding: 8px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all .12s ease;
  }
  .c16-quick button:hover { background: var(--c16-ink); color: #fff; }
  .c16-quick button.secondary { border-color: #d6d6d6; color: var(--c16-ink-2); }

  /* Match card */
  .c16-match {
    margin: 8px 4px 4px; border: 1px solid var(--c16-line); border-radius: 14px;
    overflow: hidden; background: #fff;
  }
  .c16-match-top {
    background: var(--c16-yellow); padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 13px; letter-spacing: .3px; text-transform: uppercase;
  }
  .c16-match-top .level { font-size: 11px; background: var(--c16-ink); color: var(--c16-yellow); padding: 3px 8px; border-radius: 999px; letter-spacing: .4px; }
  .c16-match-body { padding: 12px 14px; }
  .c16-match-body h3 { margin: 0 0 4px; font-size: 16px; }
  .c16-match-body .why { color: var(--c16-muted); font-size: 13px; margin: 0 0 12px; }
  .c16-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; }
  .c16-meta .k { color: var(--c16-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; }
  .c16-meta .v { font-weight: 700; margin-top: 1px; }
  .c16-price-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--c16-line); display: flex; justify-content: space-between; align-items: baseline; }
  .c16-price-row .label { font-size: 12px; color: var(--c16-muted); }
  .c16-price-row .price { font-weight: 800; font-size: 20px; }
  .c16-price-row .pack { font-size: 12px; color: var(--c16-muted); }

  .c16-cta {
    display: flex; gap: 8px; padding: 10px 14px 14px;
  }
  .c16-cta a, .c16-cta button {
    flex: 1; text-align: center; padding: 11px 14px; border-radius: 10px;
    font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer; border: 0;
  }
  .c16-cta .primary { background: var(--c16-ink); color: var(--c16-yellow); }
  .c16-cta .primary:hover { background: #000; }
  .c16-cta .ghost { background: transparent; color: var(--c16-ink); border: 1px solid var(--c16-line); }

  /* Footer / input */
  .c16-foot {
    border-top: 1px solid var(--c16-line); padding: 8px 12px; display: flex; gap: 8px;
    background: #fff; align-items: center;
  }
  .c16-foot input {
    flex: 1; border: 0; outline: 0; font-size: 14px; padding: 10px 6px;
    color: var(--c16-ink); background: transparent;
  }
  .c16-foot button {
    background: var(--c16-ink); color: var(--c16-yellow); border: 0;
    padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .c16-foot button:disabled { opacity: .35; cursor: not-allowed; }

  .c16-brand {
    text-align: center; font-size: 10.5px; color: #a8a8a8;
    padding: 4px 0 6px; letter-spacing: .3px;
  }
</style>
</head>
<body>

<div class="demo-stage">
  <h1>Court 16 — Class Concierge (preview)</h1>
  <p>Embeddable widget that qualifies prospects and matches them to the right adult tennis class. Click the yellow button at the bottom-right to start a conversation.</p>
</div>

<button class="c16-launcher" id="c16-launcher" aria-label="Open chat">
  <span class="dot" aria-hidden="true"></span>
  Find my class
</button>

<aside class="c16-widget" id="c16-widget" role="dialog" aria-label="Court 16 class finder">
  <header class="c16-head">
    <div class="c16-badge">16</div>
    <div class="c16-head-text">
      <div class="t1">Court 16 — Class Concierge</div>
      <div class="t2">Usually replies instantly</div>
    </div>
    <button class="c16-close" id="c16-close" aria-label="Close">×</button>
  </header>

  <div class="c16-body" id="c16-body"></div>
  <div class="c16-quick" id="c16-quick"></div>

  <form class="c16-foot" id="c16-foot" autocomplete="off">
    <input id="c16-input" placeholder="Type a message…" />
    <button id="c16-send" type="submit">Send</button>
  </form>
  <div class="c16-brand">Powered by Court 16 · Tennis, Remixed.</div>
</aside>

<script>
/* =========================================================================
   Real data scraped from court16.com/adult-tennis-classes and the published
   pricing image (PricingV2Programs-02.jpg, 2026). Group + private + semi-
   private; member/non-member where shown. Newton, MA was listed on the site
   but is not on the public pricing sheet, so we treat it as "contact us".
   ========================================================================= */
const LOCATIONS = {
  'brooklyn': {
    label: 'Downtown Brooklyn',
    short: 'Brooklyn',
    bookingEnabled: false, // service IDs not yet provisioned
    membershipSingle: 695,
    group:        { drop: 69, pack5: 295, pack10: 640,  pack20: 1180 },
    groupMember:  { drop: 65, pack5: 326,  pack10: 604,  pack20: 954 },
    privateSession: { nonMember: 157, member: 127 },
    semiPrivate:    { nonMember: 100, member: 80 }
  },
  'lic': {
    label: 'Long Island City, Queens',
    short: 'LIC',
    bookingEnabled: false,
    membershipSingle: 525,
    group:        { drop: 69, pack5: 295, pack10: 640,  pack20: 1180 },
    groupMember:  { drop: 65, pack5: 326,  pack10: 618,  pack20: 1022 },
    privateSession: { nonMember: 170, member: 151 },
    semiPrivate:    { nonMember: 100, member: 80 }
  },
  'fidi': {
    label: 'FiDi, Manhattan',
    short: 'FiDi',
    bookingEnabled: false,
    membershipSingle: 695,
    group:        { drop: 69, pack5: 295, pack10: 640,  pack20: 1180 },
    groupMember:  { drop: 65, pack5: 326,  pack10: 604,  pack20: 954 },
    privateSession: { nonMember: 157, member: 127 },
    semiPrivate:    { nonMember: 100, member: 80 }
  },
  'yonkers': {
    label: 'Ridge Hill, Yonkers',
    short: 'Yonkers',
    apiLocationId: 'ridgehill',
    bookingEnabled: true,            // service IDs provisioned (Tennis $75, Pickleball $58)
    introServiceId: 100236,           // tennis-intro-75 (informational; backend resolves)
    membershipSingle: 550,
    group:        { drop: 55, pack5: 265, pack10: 465,  pack20: 880 },
    groupMember:  { drop: 49, pack5: 232,  pack10: 434,  pack20: 792 },
    privateSession: { nonMember: 133, member: 103 },
    semiPrivate:    { nonMember:  93, member:  73 }
  },
  'philly': {
    label: 'Fishtown, Philadelphia',
    short: 'Philly',
    bookingEnabled: false,
    membershipSingle: 425,
    group:        { drop: 45, pack5: 215, pack10: 400,  pack20: 700 },
    groupMember:  { drop: 39, pack5: 191,  pack10: 360,  pack20: 640 },
    privateSession: { nonMember: 107, member:  87 },
    semiPrivate:    { nonMember:  81, member:  61 }
  },
  'newton': {
    label: 'Newton, Massachusetts',
    short: 'Newton',
    bookingEnabled: false,
    membershipSingle: null,
    contactOnly: true
  }
};

const CLASSES = {
  intro: {
    name: 'Introduction to Tennis',
    level: 'New to tennis',
    usta:  'No rating',
    blurb: 'Brand-new players. You\'ll learn racquet grip, footwork, and start gentle rallies — zero pressure, lots of reps.',
    duration: '60 min · max 6 players'
  },
  beginner: {
    name: 'Beginner',
    level: 'Beginner',
    usta:  'USTA 1.0 – 2.5',
    blurb: 'You can rally a little. We\'ll cement forehands, backhands, volleys, serves, and the basic rules of play.',
    duration: '60 min · max 6 players'
  },
  advBeginner: {
    name: 'Advanced Beginner',
    level: 'Advanced Beginner',
    usta:  'USTA 2.0 – 2.5',
    blurb: 'Grips and swing paths are there. Now we add topspin on groundstrokes and slice on serves.',
    duration: '60 min · max 6 players'
  },
  intermediate: {
    name: 'Intermediate',
    level: 'Intermediate',
    usta:  'USTA 2.5 – 3.5',
    blurb: 'Sharper strokes and real point play. We push pace, depth, and pattern recognition.',
    duration: '60 min · max 6 players'
  },
  advanced: {
    name: 'Advanced',
    level: 'Advanced',
    usta:  'USTA 3.5+',
    blurb: 'Match-ready. Footwork, doubles patterns, tournament prep, live-ball drills under pressure.',
    duration: '60 min · max 6 players'
  }
};

// Adult booking destinations (kids go through /trial; adults do NOT).
const ADULT_GROUP_URL = 'https://www.court16.com/locations';      // group classes by club
const ADULT_PRIVATE_URL = 'https://www.court16.com/book-private'; // private + semi-private
const MEMB_URL  = 'https://www.court16.com/adult-membership';
// Kids audience gate destination — our MindBody-integrated free trial.
const KIDS_TRIAL_URL = '/trial';

// Resolve the right "Book this class" target from the conversation state.
// Kids (and "both") → our own /trial free-trial flow with the club prefilled.
// Adults → Court 16's real adult booking pages, routed by format:
//   private / semi-private → /book-private,  group (or unset) → /locations.
// The /trial route is the KIDS funnel and must never be the adult target.
function bookUrlFor(state) {
  const s = state || {};
  if (s.audience === 'kid' || s.audience === 'both') {
    const qs = s.location ? ('?location=' + encodeURIComponent(s.location)) : '';
    return '/trial' + qs;
  }
  if (s.format === 'private' || s.format === 'semi') {
    return ADULT_PRIVATE_URL;
  }
  return ADULT_GROUP_URL;
}

/* ====================== Conversation engine ====================== */

const state = {
  step: 'greet',
  audience: null,     // self | kid | both — gates the rest of the flow
  experience: null,   // never | beginner | advBeginner | intermediate | advanced
  years: null,        // free text
  goal: null,         // fitness | social | skill | competition
  location: null,     // key of LOCATIONS
  format: null,       // group | semi | private
  // Booking state
  slots: [],          // fetched MindBody class objects (filtered/ranked)
  selectedSlot: null, // chosen class
  awaitingField: null,// 'firstName' | 'lastName' | 'email' | 'phone' | 'birthDate'
  adult: { firstName: '', lastName: '', email: '', phone: '', birthDate: '' }
};

const body   = document.getElementById('c16-body');
const quick  = document.getElementById('c16-quick');
const input  = document.getElementById('c16-input');
const sendBtn= document.getElementById('c16-send');
const form   = document.getElementById('c16-foot');
const widget = document.getElementById('c16-widget');

document.getElementById('c16-launcher').addEventListener('click', () => {
  widget.classList.add('open');
  if (!body.dataset.started) { body.dataset.started = '1'; startFlow(); }
});
// Close button: if the user has engaged at all (audience picked, etc.)
// but hasn't given us a way to reach them, surface the abandoned-cart
// capture form once before letting them out. State.askedForContact
// short-circuits any re-prompt loop.
document.getElementById('c16-close').addEventListener('click', () => {
  const engaged = !!(state.audience || state.experience || state.location || state.format);
  if (engaged && !state.leadCaptured && !state.askedForContact) {
    state.askedForContact = true;
    askForContact('abandoned');
    return; // hold the widget open
  }
  widget.classList.remove('open');
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'c16-chatbot-close' }, '*');
    }
  } catch (e) { /* noop */ }
});

// Embed mode for the redesign's iframe panel
(function () {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('embed') === '1') {
      const css = document.createElement('style');
      css.textContent = `
        html, body { height: 100%; }
        .demo-stage { display: none !important; }
        .c16-launcher { display: none !important; }
        .c16-widget { position: static !important; width: 100% !important; height: 100% !important; max-height: none !important; border-radius: 0 !important; box-shadow: none !important; border: 0 !important; }
        body { background: transparent !important; }
      `;
      document.head.appendChild(css);
      widget.classList.add('open');
      if (!body.dataset.started) { body.dataset.started = '1'; startFlow(); }
    }
  } catch (e) { /* noop */ }
})();

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v) return;
  input.value = '';
  handleFreeText(v);
});

function addBot(text, opts={}) {
  return new Promise((resolve) => {
    const typing = document.createElement('div');
    typing.className = 'c16-row bot';
    typing.innerHTML = '<div class="c16-typing"><span></span><span></span><span></span></div>';
    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;
    const delay = opts.delay ?? Math.min(900, 320 + text.length * 9);
    setTimeout(() => {
      typing.remove();
      const row = document.createElement('div');
      row.className = 'c16-row bot';
      const b = document.createElement('div');
      b.className = 'c16-bubble';
      b.textContent = text;
      row.appendChild(b);
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
      resolve();
    }, delay);
  });
}
function addUser(text) {
  const row = document.createElement('div');
  row.className = 'c16-row user';
  const b = document.createElement('div');
  b.className = 'c16-bubble';
  b.textContent = text;
  row.appendChild(b);
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
}
function addCustom(node) {
  const row = document.createElement('div');
  row.className = 'c16-row bot';
  row.style.maxWidth = '100%';
  row.appendChild(node);
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
}
function setQuickReplies(items) {
  quick.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it.label;
    if (it.secondary) b.classList.add('secondary');
    b.addEventListener('click', () => {
      addUser(it.label);
      quick.innerHTML = '';
      it.onSelect();
    });
    quick.appendChild(b);
  });
}
function clearQuick() { quick.innerHTML = ''; }

/* -------- Flow -------- */
async function startFlow() {
  await addBot("Hey! I'm the Court 16 class concierge 🎾");
  await addBot("Quick-match in 30 seconds, or just type any question (pricing, schedule, locations — I'll figure it out).");
  setQuickReplies([
    { label: "Let's go", onSelect: askAudience },
    { label: "I just have questions", secondary: true, onSelect: openEnded }
  ]);
}

async function openEnded() {
  await addBot("Totally — ask me anything about levels, locations, or pricing. Or tap below when you're ready to get matched.");
  setQuickReplies([{ label: "Match me to a class", onSelect: askAudience }]);
}

/* Audience gate — split adult-class flow from kids trial. */
async function askAudience() {
  state.step = 'audience';
  await addBot("Who are we finding tennis for?");
  setQuickReplies([
    { label: "For me",            onSelect: () => pickAudience('self') },
    { label: "For my kid",        onSelect: () => pickAudience('kid') },
    { label: "Both — me + my kid", onSelect: () => pickAudience('both') },
  ]);
}

async function pickAudience(a) {
  state.audience = a;
  if (a === 'kid' || a === 'both') {
    // Kids (or both) route into the free trial funnel — that flow
    // matches the child to Red/Orange/Green/Yellow level + live slot.
    const note = a === 'both'
      ? "Got it — let's start with your kid's free trial. We'll come back to your adult class right after."
      : "Got it — let's get your kid in for a free trial class.";
    await addBot(note);
    setQuickReplies([
      { label: "Start kids free trial →", onSelect: () => { window.open(KIDS_TRIAL_URL, '_top'); closeOut(); } },
      { label: "Back", secondary: true, onSelect: askAudience }
    ]);
    return;
  }
  // self → continue to the adult class match flow
  askExperience();
}

async function askExperience() {
  state.step = 'experience';
  await addBot("First — how would you describe your tennis right now?");
  setQuickReplies([
    { label: "Never played",           onSelect: () => pickExperience('never') },
    { label: "Beginner",               onSelect: () => pickExperience('beginner') },
    { label: "Advanced beginner",      onSelect: () => pickExperience('advBeginner') },
    { label: "Intermediate",           onSelect: () => pickExperience('intermediate') },
    { label: "Advanced",               onSelect: () => pickExperience('advanced') },
  ]);
}

async function pickExperience(lvl) {
  state.experience = lvl;
  if (lvl === 'never') {
    await addBot("Perfect — Intro to Tennis is built exactly for that. Quick follow-up:");
    return askGoal();
  }
  await addBot("Got it. About how long have you been playing?");
  state.step = 'years';
  setQuickReplies([
    { label: "Less than 1 year",  onSelect: () => { state.years = '<1 yr';  askGoal(); } },
    { label: "1–3 years",         onSelect: () => { state.years = '1–3 yrs'; askGoal(); } },
    { label: "3–5 years",         onSelect: () => { state.years = '3–5 yrs'; askGoal(); } },
    { label: "5+ years",          onSelect: () => { state.years = '5+ yrs'; askGoal(); } },
  ]);
}

async function askGoal() {
  state.step = 'goal';
  await addBot("What are you mainly looking to get out of it?");
  setQuickReplies([
    { label: "Fitness & fun",       onSelect: () => pickGoal('fitness') },
    { label: "Social / meet people",onSelect: () => pickGoal('social') },
    { label: "Build real skill",    onSelect: () => pickGoal('skill') },
    { label: "Compete / leagues",   onSelect: () => pickGoal('competition') },
  ]);
}

async function pickGoal(g) {
  state.goal = g;
  const reactions = {
    fitness:     "Love it — group classes hit the cardio sweet spot.",
    social:      "Group classes are perfect for that, max 6 on a court.",
    skill:       "Then technique drilling is going to be your friend.",
    competition: "Got it — we'll keep an eye out for higher-level options."
  };
  await addBot(reactions[g]);
  askLocation();

/* ====================== Booking flow (real MindBody) ====================== */

const API_LOCATION_ID = (locKey) => LOCATIONS[locKey].apiLocationId || locKey;
const LEVEL_KEYWORDS = {
  never:        ['intro', 'introduction', 'beginner', 'fundamentals'],
  beginner:     ['beginner', 'intro', 'fundamentals'],
  advBeginner:  ['advanced beginner', 'beginner', 'fundamentals'],
  intermediate: ['intermediate'],
  advanced:     ['advanced', 'tournament']
};

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}
function classDisplayName(c) {
  return c.name || 'Adult Class';
}
function fmtSlotLabel(c) {
  // startDateTime is wall-clock ISO like "2026-06-02T18:00:00"
  const [date, time] = c.startDateTime.split('T');
  const d = new Date(date + 'T12:00:00'); // noon avoids TZ drift on day-of-week
  const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const hh = Number(time.slice(0, 2));
  const mm = time.slice(3, 5);
  const ampm = hh >= 12 ? 'pm' : 'am';
  const h12 = ((hh + 11) % 12) + 1;
  return `${day} · ${h12}:${mm}${ampm}`;
}
function availableSpots(c) {
  if (typeof c.webCapacity === 'number') {
    return Math.max(0, c.webCapacity - (c.webBooked || 0));
  }
  return Math.max(0, (c.maxCapacity || 0) - (c.totalBooked || 0));
}
function rankClassForLevel(c, lvlKey) {
  const name = classDisplayName(c).toLowerCase();
  const kws = LEVEL_KEYWORDS[lvlKey] || [];
  let score = 0;
  kws.forEach((k, i) => { if (name.includes(k)) score += (kws.length - i); });
  // Prefer tennis/pickleball names when the data has them
  if (/(tennis|pickleball)/.test(name)) score += 2;
  // demote private if user wants group
  if (state.format === 'group' && /private/.test(name)) score -= 3;
  return score;
}

async function startBooking() {
  state.step = 'booking-fetch';
  clearQuick();
  await addBot("On it — pulling live availability at " + LOCATIONS[state.location].short + "…");

  const today = new Date();
  const end = new Date(today.getTime() + 14 * 24 * 3600 * 1000);
  const url = `/api/mindbody/calendar?locationId=${encodeURIComponent(API_LOCATION_ID(state.location))}&startDate=${fmtDate(today)}&endDate=${fmtDate(end)}&intent=adult_intro`;

  let classes = [];
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('calendar ' + r.status);
    const data = await r.json();
    classes = Array.isArray(data.classes) ? data.classes : [];
  } catch (e) {
    await addBot("Hmm, I couldn't reach the live schedule just now. Tap below to open the full booking page instead.");
    setQuickReplies([
      { label: "Open booking page", onSelect: () => { window.open(bookUrlFor(state), bookUrlFor(state).startsWith('http') ? '_blank' : '_top'); closeOut(); } },
      { label: "Try again", secondary: true, onSelect: startBooking }
    ]);
    return;
  }

  // The server has already enforced the adult Program boundary and removed
  // cancelled rows. The browser only applies availability and future guards.
  const todayIso = new Date().toISOString().slice(0, 10);
  const adult = classes
    .filter(c => availableSpots(c) > 0)
    .filter(c => (c.startDateTime || '') >= todayIso); // wall-clock string compare is safe

  // Rank by level match, then by soonest
  const ranked = adult
    .map(c => ({ c, score: rankClassForLevel(c, state.experience) }))
    .sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return a.c.startDateTime.localeCompare(b.c.startDateTime);
    })
    .map(x => x.c);

  // Prefer slots that actually scored on level; if too few, fall back to nearest adult slots
  let pool = ranked.filter(c => rankClassForLevel(c, state.experience) > 0);
  if (pool.length < 3) pool = ranked;
  state.slots = pool.slice(0, 4);

  if (state.slots.length === 0) {
    await addBot("Looks like nothing's open in the next two weeks at that level. The team can hand-match you to a slot — want me to flag you?");
    setQuickReplies([
      { label: "Yes, have someone reach out", onSelect: () => startBookingHandoff() },
      { label: "Open booking page", secondary: true, onSelect: () => { window.open(bookUrlFor(state), bookUrlFor(state).startsWith('http') ? '_blank' : '_top'); closeOut(); } }
    ]);
    return;
  }

  await addBot("Here are the closest matches. Which works?");
  setQuickReplies([
    ...state.slots.map((c, i) => ({
      label: fmtSlotLabel(c),
      onSelect: () => pickSlot(i)
    })),
    { label: "None of these", secondary: true, onSelect: () => startBookingHandoff() }
  ]);
}

async function startBookingHandoff() {
  // Route the handoff into the polished lead-capture card, which posts to
  // /api/chatbot/lead → HubSpot. (Previously this used an inline text
  // input and the lead was dropped on the floor — see the no-op in earlier
  // versions of handleHandoffInput.)
  await askForContact('handoff');
}

async function pickSlot(i) {
  state.selectedSlot = state.slots[i];
  const c = state.selectedSlot;
  await addBot(`Locked in: ${classDisplayName(c)} on ${fmtSlotLabel(c)} with ${c.coach || 'a Court 16 coach'}. Just need a few details to hold your spot.`);
  await addBot("What's your first name?");
  state.awaitingField = 'firstName';
  state.step = 'collecting';
  input.focus();
}

function validateField(field, val) {
  if (!val) return "Looks empty — mind typing it again?";
  if (field === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return "That email looks off — could you double-check?";
  if (field === 'phone') {
    const digits = val.replace(/\D/g, '');
    if (digits.length < 10) return "Need a 10-digit phone so the coach can text you if needed.";
  }
  if (field === 'birthDate') {
    const m = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return "Please use YYYY-MM-DD (e.g. 1992-08-14) so MindBody accepts it.";
    const y = Number(m[1]);
    if (y < 1900 || y > new Date().getFullYear() - 13) return "That year looks off — adults only on this booking.";
  }
  return null;
}

async function handleCollectingInput(text) {
  const field = state.awaitingField;
  const err = validateField(field, text);
  if (err) { await addBot(err); return; }

  state.adult[field] = text.trim();
  const next = {
    firstName: ['lastName', "And last name?"],
    lastName:  ['email',    "Email for the confirmation?"],
    email:     ['phone',    "Best phone number?"],
    phone:     ['birthDate',"Last one — birth date as YYYY-MM-DD?"],
    birthDate: [null,       null]
  }[field];

  if (next[0]) {
    state.awaitingField = next[0];
    await addBot(next[1]);
    return;
  }
  // All fields collected
  state.awaitingField = null;
  await submitBooking();
}

async function submitBooking() {
  const c = state.selectedSlot;
  const L = LOCATIONS[state.location];
  await addBot("Holding your spot now…");

  const [date, time] = c.startDateTime.split('T');
  const d = new Date(date + 'T12:00:00');
  const classDay = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  const hh = Number(time.slice(0, 2));
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = ((hh + 11) % 12) + 1;
  const classTime = `${h12}:${time.slice(3,5)} ${ampm}`;

  const body = {
    locationId: API_LOCATION_ID(state.location),
    offerKey: 'tennis-intro-75',
    adult: { ...state.adult },
    classScheduleId: c.classScheduleId,
    classId: c.classId,
    className: classDisplayName(c),
    classDay,
    classTime,
    classStartsAt: c.startDateTime,
    coachName: c.coach || '',
    notes: `Booked via chatbot · experience=${state.experience}, goal=${state.goal}, years=${state.years || 'n/a'}`
  };

  let result;
  try {
    const r = await fetch('/api/book/intro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    result = await r.json().catch(() => ({}));
    if (!r.ok || result.ok === false) {
      const msg = (typeof result.error === 'string' ? result.error : null)
              || (Array.isArray(result.errors) && result.errors.join(', '))
              || `Booking failed (${r.status})`;
      throw new Error(msg);
    }
  } catch (e) {
    await addBot(`Hit a snag: ${e.message}. The team can finish this manually — want them to reach out?`);
    setQuickReplies([
      { label: "Yes, have them reach out", onSelect: () => closeOut() },
      { label: "Try again", secondary: true, onSelect: () => submitBooking() }
    ]);
    return;
  }

  // Success — render confirmation card
  const card = document.createElement('div');
  card.className = 'c16-match';
  card.innerHTML = `
    <div class="c16-match-top"><span>You're in 🎾</span><span class="level">$75 INTRO</span></div>
    <div class="c16-match-body">
      <h3>${classDisplayName(c)}</h3>
      <p class="why">${classDay} · ${classTime} · ${L.label}</p>
      <div class="c16-meta">
        <div><div class="k">Coach</div><div class="v">${c.coach || '—'}</div></div>
        <div><div class="k">Court</div><div class="v">${c.court || '—'}</div></div>
        <div><div class="k">Name</div><div class="v">${state.adult.firstName} ${state.adult.lastName}</div></div>
        <div><div class="k">Email</div><div class="v" style="font-size:12px;">${state.adult.email}</div></div>
      </div>
      <div class="c16-price-row">
        <div><div class="label">Status</div><div class="price" style="font-size:14px;">${prettyStatus(result.status)}</div></div>
        <div class="pack">Ref: ${result.correlationId || '—'}</div>
      </div>
    </div>
    <div class="c16-cta">
      ${result.cartUrl ? `<a class="primary" href="${result.cartUrl}" target="_blank" rel="noopener">Complete payment →</a>` : ''}
      <button class="ghost" id="c16-restart-2" type="button">Done</button>
    </div>
  `;
  addCustom(card);
  document.getElementById('c16-restart-2').addEventListener('click', closeOut);

  await addBot(result.cartUrl
    ? "Tap 'Complete payment' to lock it in. You'll get a confirmation email once payment clears."
    : "Court 16 has your details — they'll follow up shortly to confirm."
  );
}

function prettyStatus(s) {
  switch (s) {
    case 'pending_payment': return 'Pending payment';
    case 'pending_staff_assist': return 'Pending — staff will confirm';
    case 'duplicate_email_softwall': return 'Existing account — staff to assist';
    case 'manual_review': return 'Manual review';
    default: return s || 'Submitted';

}

function priceBlock(L, format) {

function formatTitle(f) {

function ucFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

async function showMembership() {
  const L = LOCATIONS[state.location];
  if (L && !L.contactOnly && L.membershipSingle) {
    await addBot(`At ${L.short}, single membership is $${L.membershipSingle}/yr. You get member rates on every class, semi-private, and private — plus pro-shop discounts. Most folks who do 1+ class/week make it back fast.`);
  } else {

  }

async function closeOut() {
  // If the user has provided meaningful context but no contact info yet,
  // offer to take a quick email/phone for staff follow-up. Skips for
  // people who just opened the widget and bounced.
  const engaged = !!(state.audience || state.experience || state.location);
  if (engaged && !state.leadCaptured && !state.askedForContact) {

    askForContact('completed');
    return;
  }

/* ====================== Contact / lead capture ======================
 * Asks for email or phone so staff can follow up. Posts to
 * /api/chatbot/lead which upserts a HubSpot Contact with the
 * conversation state attached. `reason` is one of:
 *   - 'abandoned' (user clicked X mid-flow)
 *   - 'completed' (finished the flow but didn't book in chat)
 *   - 'questions' (opted out of the match flow)
 *   - 'handoff'   (booking blocked — non-bookable location or no slots open)
 */
async function askForContact(reason) {
  state.leadReason = reason;
  const headline = ({
    abandoned: "Before you go — want us to follow up?",
    handoff:   "I'll have the team reach out with options that fit.",
  })[reason] || "Want our team to reach out with options?";
  const sub = ({
    abandoned: "Drop your email or phone and a coach will send class times that fit. No spam.",
    handoff:   "Share your email or phone and a Court 16 coordinator will get back with the right slot, usually within one business day.",
  })[reason] || "We'll put together a short email with the right classes for your level + location.";
  await addBot(headline);
  await addBot(sub);

  // Inline form rendered as a custom message card
  const card = document.createElement('div');
  card.className = 'c16-row bot';
  card.innerHTML = `
    <div class="c16-bubble" style="max-width:96%;padding:14px;background:#fff;border:1px solid var(--c16-line);">
      <div style="display:grid;gap:8px">
        <input type="text" id="c16-lead-name" placeholder="First name (optional)" autocomplete="given-name"
          style="padding:10px 12px;border:1px solid var(--c16-line);border-radius:10px;font-size:14px;outline:0">
        <input type="email" id="c16-lead-email" placeholder="Email" autocomplete="email"
          style="padding:10px 12px;border:1px solid var(--c16-line);border-radius:10px;font-size:14px;outline:0">
        <input type="tel" id="c16-lead-phone" placeholder="Phone (optional)" autocomplete="tel"
          style="padding:10px 12px;border:1px solid var(--c16-line);border-radius:10px;font-size:14px;outline:0">
        <div id="c16-lead-error" style="display:none;color:#c62828;font-size:12px"></div>
        <button id="c16-lead-submit" type="button"
          style="background:var(--c16-ink);color:var(--c16-yellow);border:0;padding:10px 14px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px">
          Send it
        </button>
        <button id="c16-lead-skip" type="button"
          style="background:transparent;color:var(--c16-muted);border:0;padding:6px;font-size:12px;cursor:pointer">
          Skip
        </button>
      </div>
    </div>
  `;
  body.appendChild(card);
  body.scrollTop = body.scrollHeight;
  setQuickReplies([]); // hide quick replies while form is up

  const emailEl = card.querySelector('#c16-lead-email');
  const phoneEl = card.querySelector('#c16-lead-phone');
  const nameEl  = card.querySelector('#c16-lead-name');
  const errEl   = card.querySelector('#c16-lead-error');
  emailEl.focus();

  card.querySelector('#c16-lead-submit').addEventListener('click', () => {
    const email = emailEl.value.trim();
    const phone = phoneEl.value.trim();
    if (!email && !phone) {
      errEl.textContent = 'Add an email or phone so we can reach you.';
      errEl.style.display = 'block';
      return;
    }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errEl.textContent = 'That email doesn’t look right.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    submitLead({ email, phone, firstName: nameEl.value.trim(), reason });
    // disable form
    [emailEl, phoneEl, nameEl, card.querySelector('#c16-lead-submit'), card.querySelector('#c16-lead-skip')]
      .forEach(el => el.setAttribute('disabled', 'true'));
    card.querySelector('#c16-lead-submit').textContent = 'Sending…';
  });

  card.querySelector('#c16-lead-skip').addEventListener('click', () => {
    finishCloseFlow(false);
  });
}

async function submitLead({ email, phone, firstName, reason }) {
  // Build a short transcript of the last few messages
  const transcript = Array.from(body.querySelectorAll('.c16-row'))
    .slice(-8)
    .map(r => {
      const who = r.classList.contains('user') ? 'User' : 'Bot';
      const text = r.querySelector('.c16-bubble')?.textContent?.trim() || '';
      return `${who}: ${text}`;
    })
    .join('\n');

  let ok = false;
  try {
    const resp = await fetch('/api/chatbot/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, phone, firstName,
        state: {
          audience: state.audience,
          experience: state.experience,
          years: state.years,
          goal: state.goal,
          location: state.location,
          format: state.format,
        },
        transcript,
        reason,
      }),
    });
    const data = await resp.json().catch(() => ({}));
    ok = !!(data && data.ok);
  } catch (e) {
    ok = false;
  }

  state.leadCaptured = ok;
  if (ok) {
    await addBot("Got it — a coach will reach out within one business day 🎾");
  } else {
    await addBot("Saved your info — we'll be in touch shortly. (If you don't hear back, the team is at 718-875-5550.)");
  }
  finishCloseFlow(true);
}

function finishCloseFlow(captured) {
  // Either let the widget close (if user invoked from the X) or just
  // show start-over option (if invoked from the end-of-flow path).
  setQuickReplies([
    { label: "Done — close", onSelect: () => {
        widget.classList.remove('open');
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'c16-chatbot-close' }, '*');
          }
        } catch (e) { /* noop */ }
      }
    },
    { label: "Start over", secondary: true, onSelect: restart }
  ]);
}

function restart() {
  Object.assign(state, {
    step: 'greet', audience: null, experience: null, years: null, goal: null, location: null, format: null,
    slots: [], selectedSlot: null, awaitingField: null,
    leadCaptured: false, askedForContact: false, leadReason: null,
    adult: { firstName: '', lastName: '', email: '', phone: '', birthDate: '' }
  });
  body.innerHTML = '';
  clearQuick();
  llmHistory.length = 0;
  startFlow();
}

/* -------- Free-text → LLM fallback --------
 * Booking-collection and handoff steps stay deterministic (we need exact
 * field validation). Everything else flows to /api/chatbot/ask, which is
 * the Gemini-backed concierge with full KB + live MindBody slots in
 * context. The LLM may return `suggested` fields that nudge widget state
 * (location / experience / format / openBookingFlow) — we apply them
 * silently and then trigger the next deterministic step. */

const llmHistory = []; // [{ role:'user'|'model', text }]

async function handleFreeText(text) {
  addUser(text);
  if (state.step === 'collecting' && state.awaitingField) return handleCollectingInput(text);
  return askLLM(text);
}

async function askLLM(text) {
  llmHistory.push({ role: 'user', text });

  // Show typing while we wait
  const typing = document.createElement('div');
  typing.className = 'c16-row bot';
  typing.innerHTML = '<div class="c16-typing"><span></span><span></span><span></span></div>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;

  let data;
  try {
    const r = await fetch('/api/chatbot/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: llmHistory,
        state: {
          experience: state.experience,
          years: state.years,
          goal: state.goal,
          location: state.location,
          format: state.format,
        },
      }),
    });
    data = await r.json().catch(() => ({}));
    if (!r.ok || data.ok === false) throw new Error(data.error || `LLM ${r.status}`);
  } catch (e) {
    typing.remove();
    await addBot(`I'm having trouble reaching my brain right now (${e.message}). Want to keep going on the quick-reply path?`);
    if (!state.experience) return askExperience();
    if (!state.location) return askLocation();
    if (!state.format) return askFormat();
    return;
  }
  typing.remove();

  // Render LLM reply
  const row = document.createElement('div');
  row.className = 'c16-row bot';
  const b = document.createElement('div');
  b.className = 'c16-bubble';
  b.textContent = data.reply;
  row.appendChild(b);
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  llmHistory.push({ role: 'model', text: data.reply });

  // Apply suggested state nudges
  const s = data.suggested || {};
  if (s.experience && !state.experience) state.experience = s.experience;
  if (s.format && !state.format) state.format = s.format;
  if (s.location && !state.location) {
    state.location = s.location;
  }
  // If LLM thinks we're ready to book and location supports it, jump there
  if (s.openBookingFlow && state.location && LOCATIONS[state.location]?.bookingEnabled) {
    return startBooking();
  }

  // Re-surface the next deterministic chip set so they always have an option
  if (!state.experience) return askExperience();
  if (!state.location) return askLocation();
  if (!state.format) return askFormat();
  // If qualification's done, show the match again as a refresher
  if (state.experience && state.location && state.format && state.step !== 'match-shown') {
    state.step = 'match-shown';
    return showMatch();
  }
}
